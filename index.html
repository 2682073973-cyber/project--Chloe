<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fragile Bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <span class="name">Fragile · 2 taps</span>
    <button class="reset" id="reset" type="button" aria-label="Reset the bubble">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M3 2.5v2.8h2.8"/></svg>
      Reset
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="floater"><div class="shaker" id="shaker">
      <svg id="s" viewBox="0 0 300 300" aria-label="A fragile bubble">
        <defs id="defs">
          <clipPath id="bodyclip"><circle cx="150" cy="150" r="78"/></clipPath>
        </defs>
        <g id="cue">
          <circle class="ring a" cx="150" cy="150" r="92"/>
          <circle class="ring b" cx="150" cy="150" r="92"/>
        </g>
        <g id="whole" tabindex="0" role="button" aria-label="Bubble. Tap to crack it."></g>
        <g id="cracks" clip-path="url(#bodyclip)"></g>
        <g id="frags"></g>
        <g id="fx"></g>
      </svg>
    </div></div>
  </main>

  <footer>
    <div class="cue" id="cue-box" aria-live="polite">
      <div class="cue-main live" id="cue-main"><span class="dot"></span><span id="cue-text">Tap the bubble.</span></div>
      <div class="cue-sub" id="cue-sub">One touch and it breaks. Go gently.</div>
    </div>
    <ol class="track">
      <li id="t1"><span class="bar"></span>01 Crack</li>
      <li id="t2"><span class="bar"></span>02 Release</li>
    </ol>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
